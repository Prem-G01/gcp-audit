[project]
name = "gcp-audit-alerting"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.cloud.iam_credentials_v1.*",
    "google.api_core.*",
    "google.oauth2.*",
    "google.auth.*",
    "cloudevents.*",
    "functions_framework.*",
    "yaml.*",
    "google.cloud.asset_v1.*",
    "google.cloud.bigquery.*",
    "google.cloud.pubsub_v1.*",
    "google.cloud.storage.*",
    "vertexai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
