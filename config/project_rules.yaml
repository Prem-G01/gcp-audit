# Permanent rule silencing, per-project or per-folder -- a hand-edited
# alternative to the "Mute this alert" email button (which is self-service
# and time-limited via Firestore, see src/muting.py). Entries here never
# expire on their own.
#
# Schema:
#   folders:
#     <folder_id>:                # bare numeric folder ID, e.g. "89141185434"
#       <rule_id>: false          # silences this rule for every project under
#                                  # this folder -- including ones created later
#   projects:
#     <project_id>:
#       <rule_id>: false          # silences this rule for this one project
#       <rule_id>: true           # explicit alert -- overrides a folder-level
#                                  # false for just this project
#
# Precedence: an explicit entry under `projects` for a given project+rule
# (true OR false) always wins outright. Only when the project has no
# explicit entry does the folder-level setting (from the event's Cloud
# Asset Inventory ancestor folders) apply.
#
# Default is always "alert" -- a project/folder not listed here, or a rule
# not listed under one that IS here, still fires normally. Only an explicit
# `false` silences it. This means a new rule you add later, a project you
# haven't configured yet, or a brand-new project inside a listed folder, is
# never silently muted by accident.
#
# rule_id values are the exact `id` fields from config/rules.yaml.
#
# Example (uncomment and edit):
# folders:
#   "89141185434":
#     service_account_key_created: false
# projects:
#   prj-example-project:
#     service_account_key_created: false
#
# A fourth key, service_account_muted_rules, is a plain LIST of rule ids
# (not a project/folder map) -- any rule listed here is muted whenever a
# service account triggers it, in EVERY project, while still alerting
# normally when a human triggers that same rule. Use this instead of
# projects:/folders: when the noisy source isn't tied to one project, or
# you don't know which project it'll show up in next.
# service_account_muted_rules:
#   - bulk_data_export_or_download

version: 1
folders: {}
projects: {}
service_account_muted_rules:
  # Multiple automated SA-driven sources (restapi@prj-dg-ahfl-apps-prod's
  # every-15-40s file downloads, plus at least one other unidentified
  # source hitting this same rule) fired their own uncapped email per
  # event -- no volume threshold exists for this rule -- and exhausted
  # Gmail's sending limit, blocking delivery of every other alert
  # org-wide. Muted for every service account rather than one project at
  # a time; a human triggering a bulk download still alerts normally, and
  # SA-triggered alerts on every other rule are unaffected.
  - bulk_data_export_or_download
