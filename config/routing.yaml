# Severity styling and recipient routing for the Gmail alerting layer.
#
# This file is the single source of truth for:
#   - how each severity is colour-coded in the HTML alert email
#   - who receives an alert for a given severity
#
# No rule logic or recipient addresses belong in Python — edit this file
# instead of src/email_template.py or main.py.

severity_styles:
  CRITICAL:
    accent: "#ef4444"
    tint: "#fef2f2"
  HIGH:
    accent: "#f97316"
    tint: "#fff7ed"
  MEDIUM:
    accent: "#3b82f6"
    tint: "#eff6ff"
  LOW:
    accent: "#64748b"
    tint: "#f8fafc"
  INFO:
    accent: "#1d4ed8"
    tint: "#dbeafe"

  # To add a new severity: add a key here with `accent` (header bar / border
  # colour) and `tint` (light background colour) hex values, then add a
  # matching list under `recipients` below (or let it fall back to
  # `recipients.default`).
  #
  # URGENT:
  #   accent: "#7c3aed"
  #   tint: "#ede9fe"

recipients:
  # NOTE: routed to a single real mailbox for now (the same one proven
  # working by scripts/probe_dwd.py) so the pipeline is genuinely
  # end-to-end testable. Replace with real distribution lists before
  # relying on this for actual production alerting.
  CRITICAL:
    - premkumar.gunasekaran@docugenieai.com
    - premkumar.gunasekaran@securekloud.com
    - udayakrishna.duraisamy@securekloud.com
    - kalpana.babu@securekloud.com
  HIGH:
    - premkumar.gunasekaran@docugenieai.com
