# Severity styling and recipient routing for the Gmail alerting layer.
#
# This file is the single source of truth for:
#   - how each severity is colour-coded in the HTML alert email
#   - who receives an alert for a given severity
#
# No rule logic or recipient addresses belong in Python — edit this file
# instead of src/email_template.py or main.py.

severity_styles:
  CRITICAL:
    accent: "#ef4444"
    tint: "#fef2f2"
  HIGH:
    accent: "#f97316"
    tint: "#fff7ed"
  MEDIUM:
    accent: "#3b82f6"
    tint: "#eff6ff"
  LOW:
    accent: "#64748b"
    tint: "#f8fafc"
  INFO:
    accent: "#1d4ed8"
    tint: "#dbeafe"

  # To add a new severity: add a key here with `accent` (header bar / border
  # colour) and `tint` (light background colour) hex values, then add a
  # matching list under `recipients` below (or let it fall back to
  # `recipients.default`).
  #
  # URGENT:
  #   accent: "#7c3aed"
  #   tint: "#ede9fe"

recipients:
  # Tiered by severity so a LOW/INFO flood (routine VM/config changes,
  # now caught in full since unclassified_admin_activity became a true
  # catch-all -- see config/rules.yaml) doesn't bury the whole team in
  # noise. CRITICAL/HIGH keep full visibility for everyone; MEDIUM and
  # below narrow to the platform owner's two identities only. Adjust
  # freely -- this is a first cut, not a fixed policy.
  CRITICAL:
    - premkumar.gunasekaran@docugenieai.com
    - premkumar.gunasekaran@securekloud.com
    - udayakrishna.duraisamy@securekloud.com
    - kalpana.babu@securekloud.com
  HIGH:
    - premkumar.gunasekaran@docugenieai.com
    - premkumar.gunasekaran@securekloud.com
    - udayakrishna.duraisamy@securekloud.com
    - kalpana.babu@securekloud.com
  MEDIUM:
    - premkumar.gunasekaran@docugenieai.com
    - premkumar.gunasekaran@securekloud.com
    - udayakrishna.duraisamy@securekloud.com
    - kalpana.babu@securekloud.com
  LOW:
    - premkumar.gunasekaran@docugenieai.com
    - premkumar.gunasekaran@securekloud.com
    - udayakrishna.duraisamy@securekloud.com
    
  INFO:
    - premkumar.gunasekaran@docugenieai.com
    - premkumar.gunasekaran@securekloud.com
    - udayakrishna.duraisamy@securekloud.com


  # Used when a finding's severity has no explicit entry above.
  default:
    - premkumar.gunasekaran@docugenieai.com
    - premkumar.gunasekaran@securekloud.com

# Any alert whose Principal is a service account (*.iam.gserviceaccount.com,
# not a human user) routes here instead of the severity-based `recipients`
# above -- overrides severity entirely for SA-triggered findings. Add your
# minimal contact(s) here. Empty list = feature off (falls through to
# normal severity routing, same as before this key existed).
service_account_notification_recipients:
  - premkumar.gunasekaran@docugenieai.com
  - udayakrishna.duraisamy@securekloud.com
