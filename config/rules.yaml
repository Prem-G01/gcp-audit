# Declarative detection rules for the GCP audit alerting platform.
#
# Adding, disabling, or retuning a rule is a YAML-only change -- never touch
# src/rules/engine.py to do it. The engine loads and validates this file at
# Cloud Function cold start; a malformed rule fails loudly there, not at
# match time.
#
# -----------------------------------------------------------------------------
# SCHEMA
# -----------------------------------------------------------------------------
# version: 1                     (required, must be exactly 1)
# defaults:                      (optional; applied to any rule that omits
#                                 the same key)
#   severity: MEDIUM
#   ai_analysis: false
#   enabled: true
# rules:                         (required, non-empty list)
#   - id: <unique string>                    required
#     title: <string>                        required -- email subject line
#     description: <string>                  optional, free text
#     severity: CRITICAL|HIGH|MEDIUM|LOW|INFO  must be a key present in
#                                               config/routing.yaml's
#                                               severity_styles
#     enabled: true|false                    optional, defaults.enabled
#     ai_analysis: true|false                optional, defaults.ai_analysis
#                                             -- Gemini only runs when this
#                                             is true. Keep it true only for
#                                             rules where a human judgment
#                                             call ("is this legitimate?")
#                                             adds real value -- it costs
#                                             money per finding.
#     console_url_template: <string, optional>
#                                             {project_id} and {resource_name}
#                                             are the ONLY placeholders
#                                             allowed -- anything else fails
#                                             validation at load time.
#     match: <condition tree, required>      see below
#     fields: {<label>: <dotted path>, ...}  what shows up in the email body
#
# -----------------------------------------------------------------------------
# CONDITION TREE
# -----------------------------------------------------------------------------
# A condition is exactly one of:
#   all_of: [<condition>, ...]     -- true iff every child is true
#   any_of: [<condition>, ...]     -- true iff at least one child is true
#   not: <condition>               -- negation
#   { field: <dotted path>, op: <operator>, value: <literal or list> }
#                                   -- a leaf condition (see operators below)
#
# `field` is a dotted path resolved against the enriched event. The first
# segment is one of: method_name, principal_email, resource_name,
# resource_type, project_id, severity, event_timestamp, raw_log_id,
# request_metadata, asset_labels, asset_ancestors, enrichment_ok, raw.
# Everything after the first segment walks into dicts (by key) and lists (by
# numeric index) -- e.g. `raw.protoPayload.authenticationInfo.principalEmail`
# or `request_metadata.caller_ip`. A path that doesn't resolve is a
# NON-MATCH for every operator except `not_exists`.
#
# `raw` carries the ENTIRE original Cloud Audit Log entry -- every field
# GCP ever puts on protoPayload.authenticationInfo is reachable through it,
# not just principal_email. Useful paths for identity/attribution and
# before-after detail (present only when the calling API actually populates
# them -- always resolve via `fields:`, which silently omits anything
# absent, never via `match:` unless you also handle the not-present case):
#   raw.protoPayload.authenticationInfo.principalSubject
#       Full principal string. For a human/SA it mirrors principalEmail
#       prefixed with user:/serviceAccount:; for a Workload Identity
#       Federation caller (no GCP principalEmail at all) it looks like
#       principal://iam.googleapis.com/projects/NUM/locations/global/
#       workloadIdentityPools/POOL/subject/SUBJECT -- this is the only
#       reliable way to see a federated/external caller's real identity.
#   raw.protoPayload.authenticationInfo.serviceAccountKeyName
#       Resource name of the SA key used, when the call was authenticated
#       with a long-lived JSON key rather than short-lived credentials.
#   raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
#       The impersonation/delegation chain -- who (or what federated
#       identity) is actually behind a service-account-attributed call.
#   raw.protoPayload.serviceData.policyDelta.bindingDeltas
#       A genuine before/after: explicit ADD/REMOVE entries for IAM policy
#       binding changes, when the calling service populates it. Most other
#       APIs do NOT log a prior state at all -- only `request` (the newly
#       submitted state). Cloud Asset Inventory enrichment here is
#       current-state-only (no history), so anything not covered by a
#       delta field genuinely has no "before" available to this pipeline.
#   raw.protoPayload.request / raw.protoPayload.response
#       The newly-requested state / the API's response. Label these
#       "Requested ..." in `fields:`, not "before/after" -- they are not a
#       diff.
#
# -----------------------------------------------------------------------------
# OPERATORS (closed set -- exactly these eleven, nothing else, no eval/exec)
# -----------------------------------------------------------------------------
#   equals, not_equals   direct ==, with a NARROW type-coercion fallback for
#                         numeric-string-vs-number and bool-vs-"true"/"false"
#                         string only (never a blanket stringify -- so the
#                         YAML string "None" will NOT match a real null).
#   contains,             for a string value: substring check.
#   not_contains          for a dict/list value: recursively searches VALUES
#                         only (never dict keys), depth-capped, so a field
#                         literally named "...allUsersReadOnly" will NOT
#                         false-positive a `contains: allUsers` check on its
#                         key -- only on an actual value somewhere inside.
#                         NOTE: this is not correlation-aware -- it can't
#                         express "the SAME list element has role X AND
#                         member Y". For broad public-exposure detection
#                         (allUsers anywhere in a policy diff) that's the
#                         desired behaviour; for anything needing per-element
#                         correlation, this operator set can't express it.
#   starts_with, ends_with   string prefix/suffix, case-sensitive.
#   in, not_in            value must be a YAML list; membership check (same
#                         narrow coercion as equals).
#   regex                 value must be a string; precompiled at load time
#                         (a bad pattern fails cold start). Uses re.search
#                         (UNANCHORED) -- always anchor allowlist-style
#                         patterns with ^...$ or a substring match will let
#                         "admin@company.com.evil.com" through an
#                         "admin@company\.com" pattern. Matched text is
#                         capped to 4096 chars before matching.
#   exists, not_exists     no `value` key. True iff the dotted path
#                         resolves (exists) / doesn't resolve (not_exists).
#
# All string comparisons are case-sensitive; use `regex` with an inline
# `(?i)` flag for case-insensitive matching.

version: 1

defaults:
  severity: MEDIUM
  ai_analysis: false
  enabled: true

rules:
  # 1. Any IAM policy binding change, anywhere (projects, folders, orgs,
  #    buckets, service accounts, ...). Broad and cheap -- catches the raw
  #    fact of a policy change; rules 5 and 6 below narrow in on the
  #    specific dangerous shapes of a policy change.
  - id: iam_policy_change
    title: "IAM policy changed"
    description: >
      A SetIamPolicy call was made against some resource. Broad catch-all
      for IAM binding changes across every GCP service.
    severity: HIGH
    ai_analysis: false
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: contains
          value: "SetIamPolicy"
        - not:
            field: raw.logName
            op: contains
            # A denied SetIamPolicy attempt carries the same method_name as
            # a genuine one -- without this, a blocked attempt would still
            # fire this rule and misreport it as a real policy change. Only
            # policy_denied_access_attempt matches this log category.
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # A Data Access SetIamPolicy call doesn't really occur in
            # practice, but excluded for the same reason every rule here
            # is: only bulk_data_export_or_download matches this category.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # A System Event SetIamPolicy call doesn't occur either
            # (System Event is Google-generated infra churn, never a user
            # IAM call) -- excluded for the same defense-in-depth
            # consistency as every rule here.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method: method_name
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      IAM Binding Changes (Delta): raw.protoPayload.serviceData.policyDelta.bindingDeltas
      Requested Policy: raw.protoPayload.request.policy

  # 2. Service account key creation -- long-lived credentials are a
  #    perennial top exfiltration risk.
  - id: service_account_key_created
    title: "Service account key created"
    description: >
      A new (downloadable) service account key was created. Long-lived keys
      are a standing credential-theft risk; prefer Workload Identity or
      short-lived tokens.
    severity: HIGH
    ai_analysis: false
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: equals
          value: "google.iam.admin.v1.CreateServiceAccountKey"
        - not:
            field: raw.logName
            op: contains
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # CreateServiceAccountKey is always an Admin Activity entry,
            # never Data Access -- excluded here for the same defense-in-
            # depth reasoning as every other rule, not a known false-
            # positive risk.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # Same reasoning, System Event category: CreateServiceAccountKey
            # never occurs there either.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Service Account: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent

  # 3. Organization policy modification -- org policies are guardrails;
  #    changing one often *removes* a guardrail rather than adding one.
  - id: org_policy_modified
    title: "Organization policy modified"
    description: >
      An org policy constraint was created, updated, or deleted. Org
      policies are org-wide guardrails (e.g. disallow public IPs, restrict
      resource locations) -- a change here can silently weaken every
      project under it.
    severity: HIGH
    ai_analysis: true
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: contains
          value: "OrgPolicy"
        - not:
            field: raw.logName
            op: contains
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # An OrgPolicy call is always Admin Activity, never Data
            # Access -- excluded for defense-in-depth consistency, not a
            # known false-positive risk.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # Same reasoning, System Event category: an OrgPolicy call
            # never occurs there either.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method: method_name
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Requested Policy: raw.protoPayload.request

  # 4. Firewall rule permitting the entire internet.
  - id: firewall_open_to_internet
    title: "Firewall rule permits 0.0.0.0/0"
    description: >
      A firewall rule was created or updated with a source range covering
      the entire internet (0.0.0.0/0).
    severity: CRITICAL
    ai_analysis: false
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: in
          value:
            - "v1.compute.firewalls.insert"
            - "v1.compute.firewalls.patch"
            - "beta.compute.firewalls.insert"
            - "beta.compute.firewalls.patch"
        - field: raw.protoPayload.request
          op: contains
          value: "0.0.0.0/0"
        - not:
            field: raw.logName
            op: contains
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # A firewall insert/patch call is always Admin Activity, never
            # Data Access -- excluded for defense-in-depth consistency,
            # not a known false-positive risk.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # Same reasoning, System Event category: a firewall
            # insert/patch call never occurs there either.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method: method_name
      Firewall Rule: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Requested Firewall Config: raw.protoPayload.request

  # 5. Public IAM/bucket grant -- allUsers or allAuthenticatedUsers added
  #    to any policy. Intentionally broad: alerting on ANY occurrence,
  #    regardless of the granted role, is the correct posture here (a
  #    viewer-level public grant is still a public grant worth a look).
  - id: public_iam_grant
    title: "Public principal granted IAM access"
    description: >
      allUsers or allAuthenticatedUsers appears in an IAM policy diff --
      typically means a bucket, object, or other resource just became
      publicly accessible.
    severity: CRITICAL
    ai_analysis: true
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: contains
          value: "SetIamPolicy"
        - any_of:
            - field: raw.protoPayload.request
              op: contains
              value: "allUsers"
            - field: raw.protoPayload.request
              op: contains
              value: "allAuthenticatedUsers"
            - field: raw.protoPayload.response
              op: contains
              value: "allUsers"
            - field: raw.protoPayload.response
              op: contains
              value: "allAuthenticatedUsers"
        - not:
            field: raw.logName
            op: contains
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # A SetIamPolicy call is always Admin Activity, never Data
            # Access -- excluded for defense-in-depth consistency, not a
            # known false-positive risk.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # Same reasoning, System Event category: a SetIamPolicy call
            # never occurs there either.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      IAM Binding Changes (Delta): raw.protoPayload.serviceData.policyDelta.bindingDeltas
      Requested Policy: raw.protoPayload.request.policy

  # 6. Audit logging configuration changed -- often the first move to
  #    reduce visibility before other changes.
  - id: audit_config_changed
    title: "Audit logging configuration changed"
    description: >
      A SetIamPolicy call modified the auditConfigs section of a policy --
      i.e. someone changed which activities get Data Access logged. Often
      used to reduce visibility ahead of other changes. Uses `exists` on the
      precise nested path rather than `contains`, because "auditConfigs" is
      the name of a KEY here, not a value -- and `contains` deliberately
      only searches values (see the operator notes above), so `exists` is
      the correct tool for detecting a key's presence.
    severity: HIGH
    ai_analysis: true
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: contains
          value: "SetIamPolicy"
        - field: raw.protoPayload.request.policy.auditConfigs
          op: exists
        - not:
            field: raw.logName
            op: contains
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # A SetIamPolicy call is always Admin Activity, never Data
            # Access -- excluded for defense-in-depth consistency, not a
            # known false-positive risk.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # Same reasoning, System Event category: a SetIamPolicy call
            # never occurs there either.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Requested Audit Config: raw.protoPayload.request.policy.auditConfigs

  # 7. Safety net -- ANY mutating Admin Activity call not already caught by
  #    a rule above. Without this, a method nobody thought to write a rule
  #    for produces zero alert, silently. LOW severity by design: this rule
  #    is meant to guarantee visibility, not to compete with the specific
  #    CRITICAL/HIGH rules above for attention.
  #
  #    "insert"/"create"/"delete" are deliberately NOT in this rule's verb
  #    list -- rules 11 and 12 catch those unconditionally (any create/
  #    insert, any delete, org-wide, HIGH), so leaving them here would
  #    duplicate a HIGH alert with a redundant LOW one on every single
  #    occurrence. Everything else (update/patch/remove/enable/disable/
  #    revoke/grant/add/attach/detach/rotate/undelete/restore/move/import/
  #    export) still flows through this LOW safety net.
  #
  #    It deliberately does NOT try to exclude every case already covered
  #    by rules 4-6 (e.g. a non-public firewall change or a SetIamPolicy
  #    call with no auditConfigs/allUsers will match both this rule and
  #    nothing else, or this rule and one other) -- only the three method
  #    families that rules 1-3 catch UNCONDITIONALLY (every SetIamPolicy,
  #    every CreateServiceAccountKey, every OrgPolicy call) are excluded,
  #    since those would otherwise duplicate a HIGH alert on literally
  #    every single occurrence. Precisely excluding every conditionally-
  #    matched rule's exact shape here would silently reopen the exact gap
  #    this rule exists to close the next time one of those conditions
  #    changes. A little overlap (an extra LOW email alongside a CRITICAL
  #    one) is the safer failure mode for a safety net than a silent gap.
  - id: unclassified_admin_activity
    title: "Unclassified admin activity"
    description: >
      A genuine catch-all for Admin Activity: this rule explicitly
      excludes Data Access log entries (raw.logName containing
      "%2Fdata_access", only present at all when
      modules/logging's include_data_access_logs = true) and System Event
      entries ("%2Fsystem_event", include_system_event_logs) below, since
      Google never writes a read-only Get/List/Watch call to the Admin
      Activity category -- so every Admin Activity event reaching this
      pipeline is ALREADY a mutating call, guaranteed by the log category
      itself, not by anything this rule re-derives from the method name.
      Data Access and System Event entries carry no such guarantee (most
      Data Access entries are plain reads; System Event entries are
      Google-generated infrastructure churn, not a human/SA action at
      all), which is exactly why they're excluded rather than folded into
      this same catch-all -- see bulk_data_export_or_download and
      system_event_occurred for what's alerted on there instead. This
      rule fires on every Admin Activity event that isn't specifically
      covered by another rule (SetIamPolicy, an OrgPolicy method, or
      create/delete -- rules 11/12 cover those at HIGH severity instead).
      Previously this matched only a hand-picked
      whitelist of verbs (update/patch/remove/enable/...), which silently
      missed real modifications using any other verb -- e.g.
      compute.instances.setMachineType (VM resize) and
      compute.disks.resize matched neither "insert/create" nor "delete"
      nor any word in that whitelist, so a VM resize never alerted at all.
      Exists so nothing mutating is ever silently unalerted -- now actually
      true.
    severity: MEDIUM
    ai_analysis: false
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - not:
            field: method_name
            op: regex
            value: "(?i)(insert|create)"
        - not:
            field: method_name
            op: regex
            value: "(?i)delete"
        - not:
            field: method_name
            op: contains
            value: "SetIamPolicy"
        - not:
            field: method_name
            op: contains
            value: "OrgPolicy"
        - not:
            all_of:
              # This platform's own Terraform-driven deploys call
              # FunctionService.UpdateFunction on this very function every
              # apply -- routine, expected, and otherwise fires this rule
              # on itself constantly. Scoped to the known deploy SA only,
              # NOT to the method name alone -- an UpdateFunction from any
              # OTHER principal is exactly the case this rule exists to
              # catch (e.g. a compromised credential modifying the
              # function's code), so that stays fully alertable.
              - field: method_name
                op: contains
                value: "FunctionService.UpdateFunction"
              - field: principal_email
                op: equals
                value: "tf-apply-audit-platform@prj-dg-devops-test.iam.gserviceaccount.com"
        - not:
            all_of:
              # Same self-noise, different resource: mute-web is a direct
              # Cloud Run service (not Cloud-Functions-backed), so its own
              # Terraform-driven updates show up as Services.UpdateService
              # instead of FunctionService.UpdateFunction. Same scoping
              # logic -- known deploy SA only, any other principal stays
              # fully alertable.
              - field: method_name
                op: contains
                value: "Services.UpdateService"
              - field: principal_email
                op: equals
                value: "tf-apply-audit-platform@prj-dg-devops-test.iam.gserviceaccount.com"
        - not:
            field: raw.logName
            op: contains
            # Especially important here -- this is the catch-all, so
            # without this exclusion EVERY denied attempt not already
            # claimed by a more specific rule would land here instead of
            # policy_denied_access_attempt, still reporting a blocked
            # action's method_name as if some administrative activity had
            # actually gone through.
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # THE load-bearing exclusion for this rule -- without it,
            # every Data Access entry not otherwise excluded (i.e. every
            # BigQuery query, every GCS object read) would flood in here
            # at MEDIUM severity the moment include_data_access_logs is
            # turned on. Only bulk_data_export_or_download matches this
            # log category.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # ALSO load-bearing once System Event logs are on: none of
            # System Event's method names (preempted, hostError,
            # automaticRestart, guestTerminate, terminateOnHostMaintenance,
            # recreateInstance, stop, start, reset) are covered by the
            # insert/create/delete/SetIamPolicy/OrgPolicy exclusions above
            # -- without this, every one of them would flood in here too.
            # system_event_occurred is the rule that watches this category.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method: method_name
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Requested Change: raw.protoPayload.request

  # 8. Federated/external identity (Workload Identity Federation) performed
  #    a mutating action. Fires IN ADDITION to whichever rule above also
  #    matched (rules are independent -- this is intentional): an external
  #    identity acting on this project is inherently higher-scrutiny than
  #    an internal user or one of this project's own service accounts,
  #    regardless of what the action actually was.
  - id: federated_identity_action
    title: "Federated identity performed a mutating action"
    description: >
      The calling principal's principalSubject indicates a Workload
      Identity Federation caller (an external identity -- e.g. a GitHub
      Actions run or another cloud's workload -- impersonating access into
      this project, never a native GCP user or service account). Flags any
      mutating call from such a caller for extra scrutiny.
    severity: HIGH
    ai_analysis: true
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: raw.protoPayload.authenticationInfo.principalSubject
          op: contains
          value: "workloadIdentityPools"
        - field: method_name
          op: regex
          value: '(?i)(insert|create|update|patch|delete|remove|enable|disable|revoke|grant|add|attach|detach|rotate|undelete|restore|move|import|export|set)'
        - not:
            field: raw.logName
            op: contains
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # This regex is broad enough to match a BigQuery query job
            # (method_name ...JobService.InsertJob contains "insert" even
            # for a plain SELECT) -- without this, a federated identity
            # running an ordinary query would misfire this rule as if it
            # had performed a mutating action. bulk_data_export_or_download
            # is the rule that watches federated/any-principal exports.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # System Event entries have no real "federated identity"
            # principal in practice (they're Google-generated, not a WIF
            # caller) -- excluded for defense-in-depth consistency, not a
            # known false-positive risk.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal Subject (Federated Identity): raw.protoPayload.authenticationInfo.principalSubject
      Principal Email (if mapped): principal_email
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method: method_name
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Requested Change: raw.protoPayload.request

  # 9. New project created. Only ever visible to an ORG-LEVEL log sink --
  #    a project-scoped sink structurally cannot see this event, because
  #    the project doesn't exist yet at the moment it's created; the audit
  #    log entry is emitted under the parent org/folder, not the new
  #    project. Requires config/routing.yaml's deployment_mode = "full"
  #    (see terraform/modules/logging) to ever fire.
  - id: project_created
    title: "New GCP project created"
    description: >
      A new project was created somewhere in the organization. Legitimate
      most of the time, but new-project creation is also how shadow IT and
      exfiltration staging areas get set up outside existing guardrails --
      worth a human glance every time.
    severity: HIGH
    ai_analysis: true
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: contains
          value: "CreateProject"
        - not:
            field: raw.logName
            op: contains
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # CreateProject is always Admin Activity, never Data Access --
            # excluded for defense-in-depth consistency, not a known
            # false-positive risk.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # Same reasoning, System Event category: CreateProject never
            # occurs there either.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      New Project Resource: resource_name
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Requested Project Details: raw.protoPayload.request

  # 10. Billing account linked/changed, either on a project (someone
  #     switched which billing account pays for a project -- a classic
  #     cost-fraud/account-takeover move) or on the billing account
  #     resource itself. Also org-sink-dependent for anything outside this
  #     project. CRITICAL: unlike most changes here, a billing swap can
  #     have immediate real-money consequences.
  - id: billing_account_changed
    title: "Billing account linked or modified"
    description: >
      A project's billing account was linked/changed, or the billing
      account resource itself was modified (created, updated, moved,
      IAM changed). Matches both google.cloud.billing.v1.CloudBilling.
      UpdateProjectBillingInfo and direct BillingAccount-resource methods.
    severity: CRITICAL
    ai_analysis: true
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: regex
          value: "(BillingAccount|ProjectBillingInfo)"
        - not:
            field: raw.logName
            op: contains
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # Billing methods are always Admin Activity, never Data
            # Access -- excluded for defense-in-depth consistency, not a
            # known false-positive risk.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # Same reasoning, System Event category: billing methods never
            # occur there either.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method: method_name
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Requested Change: raw.protoPayload.request

  # 11. Any resource created (VM, disk, network, bucket, dataset, topic,
  #     ...), org-wide. Excludes CreateServiceAccountKey and CreateProject
  #     -- those already have their own dedicated, more detailed HIGH
  #     rules (2 and 9) with Gemini analysis; this rule firing too would
  #     just be a second, more generic email for the exact same event.
  - id: resource_created
    title: "Resource created"
    description: >
      A create/insert call succeeded against some resource. Broad by
      design -- VM instances, disks, networks, buckets, and more all use
      "insert" or "Create" in their method name. Creation can carry real
      cost and is a common pattern for resource abuse (e.g. cryptomining)
      if credentials are compromised.
    severity: HIGH
    ai_analysis: false
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: regex
          value: "(?i)(insert|create)"
        - not:
            field: method_name
            op: contains
            value: "CreateServiceAccountKey"
        - not:
            field: method_name
            op: contains
            value: "CreateProject"
        - not:
            field: method_name
            op: contains
            # Cloud Build kicks one of these off for every deploy this repo's
            # own scripts/CI trigger (gcloud builds submit, Cloud Functions
            # v2's own build-on-deploy) -- routine CI/CD activity, not a
            # security-relevant resource creation, and "Requested Change"
            # below would otherwise dump the entire Build object (every
            # GOOGLE_* substitution var, image labels, tags) as noise.
            value: "CloudBuild.CreateBuild"
        - not:
            field: method_name
            op: contains
            # Network Intelligence Center's Connectivity Tests are network
            # diagnostics simulations (does this path reach that endpoint?)
            # -- not real infrastructure, no cost, no attacker capability.
            # Its request payload is also inherently deep/sprawling (source
            # + destination endpoints, protocol, labels, related test
            # config), which made "Requested Change" render as a wall of
            # nested detail for an event that was never security-relevant
            # in the first place. Confirmed live -- see the screenshot that
            # prompted this exclusion.
            value: "ReachabilityService.CreateConnectivityTest"
        - not:
            field: raw.logName
            op: contains
            # A denied create attempt carries the same method_name as a
            # genuine one -- without this, a blocked attempt would still
            # fire this rule and misreport it as a real HIGH-severity
            # resource creation that never actually happened.
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # THE load-bearing exclusion for this rule once Data Access
            # logs are on: a BigQuery query job's method_name is
            # ...JobService.InsertJob for EVERY job type, including a
            # plain SELECT -- "Insert" alone would otherwise misfire this
            # HIGH "resource created" rule on an ordinary read. Likewise
            # storage.objects.insert (a GCS upload) is a genuine data
            # write, not an infrastructure resource creation -- it belongs
            # to bulk_data_export_or_download's DATA_WRITE story, not this
            # rule's "a VM/bucket/network now exists" story.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # ALSO load-bearing once System Event logs are on: a Managed
            # Instance Group's auto-healing recreating an unhealthy
            # instance can show up as a System Event compute.instances.
            # insert -- that's automated infrastructure self-repair, not
            # "someone created a resource". system_event_occurred is the
            # rule that watches this category instead.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method: method_name
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Requested Change: raw.protoPayload.request

  # 12. Any resource deleted, org-wide. Unlike creation, deletion is
  #     often not reversible -- data loss risk, not just cost/abuse risk.
  - id: resource_deleted
    title: "Resource deleted"
    description: >
      A delete call succeeded against some resource. Broad by design --
      often not reversible, so worth a human glance every time regardless
      of what the specific resource type was.
    severity: HIGH
    ai_analysis: false
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: method_name
          op: regex
          value: "(?i)delete"
        - not:
            field: raw.logName
            op: contains
            value: "cloudaudit.googleapis.com%2Fpolicy"
        - not:
            field: raw.logName
            op: contains
            # THE load-bearing exclusion for this rule once Data Access
            # logs are on: storage.objects.delete (a GCS object delete) is
            # a Data Access DATA_WRITE entry, not Admin Activity -- it's a
            # data-plane write, not "an infrastructure resource is gone",
            # so it belongs to bulk_data_export_or_download's story
            # instead, not this rule's.
            value: "cloudaudit.googleapis.com%2Fdata_access"
        - not:
            field: raw.logName
            op: contains
            # ALSO load-bearing once System Event logs are on: a Managed
            # Instance Group's autoscaler scaling down can show up as a
            # System Event compute.instances.delete -- automated capacity
            # management, not "someone deleted a resource".
            # system_event_occurred is the rule that watches this category
            # instead.
            value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Service Account Key Used: raw.protoPayload.authenticationInfo.serviceAccountKeyName
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method: method_name
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Requested Change: raw.protoPayload.request

  # 13. IAM denied a request -- the caller attempted something they don't
  #     have permission for. Only reachable when the log sink also forwards
  #     Policy Denied audit logs (see terraform/modules/logging's filter --
  #     Admin Activity logs alone never carry these). Every entry in that
  #     log category is, by definition, a denied attempt, so identifying
  #     the log category itself (raw.logName) IS the match condition -- no
  #     method_name pattern needed. A single denial is often an honest
  #     mistake (someone clicking around without realizing they lack
  #     access), but it's also the exact signature of a compromised-but-
  #     under-privileged credential probing what it can reach. MEDIUM
  #     reflects that single-event ambiguity -- this rule evaluates each
  #     event independently (no cross-event counting), so "5 denials in 10
  #     minutes from the same principal" is a stronger signal than any one
  #     of them alone, but isn't expressible here without a separate
  #     stateful mechanism this pipeline doesn't have today.
  - id: policy_denied_access_attempt
    title: "Access denied by IAM policy"
    description: >
      A caller attempted an action and IAM denied it. Every rule above
      explicitly excludes this log category (raw.logName containing
      "%2Fpolicy") -- without those exclusions, a denied attempt would
      still match e.g. resource_created's method_name pattern and
      misreport a blocked action as a real, successful change.
    severity: MEDIUM
    ai_analysis: false
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      field: raw.logName
      op: contains
      value: "cloudaudit.googleapis.com%2Fpolicy"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method (Attempted): method_name
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Denied Permissions: raw.protoPayload.authorizationInfo
      Denial Detail: raw.protoPayload.status

  # 14. Bulk data export/download -- the one Data Access rule, only
  #     reachable when modules/logging's include_data_access_logs = true
  #     (BigQuery + Cloud Storage DATA_READ/DATA_WRITE, folder-scoped via
  #     google_folder_iam_audit_config). Deliberately narrow: the rule
  #     engine evaluates each event independently with no numeric
  #     threshold operator, so a blanket "alert on every DATA_READ" would
  #     mean an email per BigQuery query / per GCS object read -- easily
  #     thousands/day on an active project. Scoped instead to the two
  #     patterns that actually look like bulk data egress:
  #       - A BigQuery EXTRACT job (table -> GCS/local) -- the "Method
  #         contains JobService" + "metadata contains EXTRACT" pair below
  #         is deliberately loose about the exact nested path (BigQuery's
  #         audit log schema has moved before -- see the migration-guide
  #         link in this repo's research), using the same defensive
  #         "search the whole dict's values" technique public_iam_grant
  #         uses for "allUsers" rather than hardcoding
  #         protoPayload.metadata.jobChange.job.jobConfig.type.
  #       - A GCS object download (storage.objects.get) by any principal
  #         OTHER than this platform's own two service accounts (self-
  #         noise -- e.g. this function reading its own deployed source).
  #     Deliberately NOT covered: plain BigQuery SELECT queries and GCS
  #     reads in general -- see this rule's description for the noise
  #     tradeoff that shaped this choice.
  - id: bulk_data_export_or_download
    title: "Bulk data export or download"
    description: >
      A BigQuery EXTRACT job or a GCS object download occurred. Every
      other rule in this file excludes this log category (raw.logName
      containing "%2Fdata_access") -- without those exclusions, e.g. a
      BigQuery query job's InsertJob method_name would misfire
      resource_created, and unclassified_admin_activity's catch-all would
      flood on every ordinary read the moment Data Access logs are
      enabled. This rule intentionally does NOT alert on every read
      (every SELECT, every object GET) -- the rule engine has no numeric
      threshold operator, so "alert only past N GB" isn't expressible
      here, and a true per-event catch-all on Data Access traffic would
      be overwhelming on any actively-queried project. Narrowed instead to
      bulk egress specifically: BigQuery EXTRACT jobs and GCS downloads by
      principals outside this platform's own service accounts.
    severity: HIGH
    ai_analysis: true
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      all_of:
        - field: raw.logName
          op: contains
          value: "cloudaudit.googleapis.com%2Fdata_access"
        - any_of:
            - all_of:
                - field: method_name
                  op: contains
                  value: "JobService"
                - field: raw.protoPayload.metadata
                  op: contains
                  value: "EXTRACT"
            - all_of:
                - field: method_name
                  op: equals
                  value: "storage.objects.get"
                - not:
                    field: principal_email
                    op: in
                    value:
                      - "audit-platform-sa-prj-dg-devop@prj-dg-devops-test.iam.gserviceaccount.com"
                      - "tf-apply-audit-platform@prj-dg-devops-test.iam.gserviceaccount.com"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Impersonation/Delegation Chain: raw.protoPayload.authenticationInfo.serviceAccountDelegationInfo
      Event Time (IST): event_timestamp
      Method: method_name
      Resource: resource_name
      Project: project_id
      Caller IP: request_metadata.caller_ip
      User Agent: request_metadata.user_agent
      Data Access Detail: raw.protoPayload.metadata

  # 15. System Event catch-all -- the mirror of unclassified_admin_activity
  #     for the System Event log category, only reachable when
  #     modules/logging's include_system_event_logs = true. Unlike Data
  #     Access, System Event volume is inherently bounded (driven by
  #     actual infrastructure churn -- host maintenance, preemption, live
  #     migration, instance-group auto-healing/autoscaling -- not by every
  #     read/query), so a genuine catch-all is safe here the way it
  #     wouldn't have been for Data Access. LOW severity: these are
  #     Google-generated events, not a human/SA action, so they carry far
  #     less attacker-relevance than an equivalent Admin Activity event --
  #     this is operational visibility (e.g. "a VM you didn't touch just
  #     went down"), not a security judgment call, hence ai_analysis:
  #     false too.
  - id: system_event_occurred
    title: "System event occurred"
    description: >
      A System Event log entry was recorded -- e.g. a VM host
      maintenance/preemption/live-migration event, or a managed instance
      group's auto-healing/autoscaling action. These are written by
      Google's own infrastructure, never by a user or service account
      directly, so principal fields are typically empty. Every other rule
      in this file excludes this log category (raw.logName containing
      "%2Fsystem_event") -- without those exclusions, e.g. a Managed
      Instance Group auto-healing an instance would misfire
      resource_created (its method_name legitimately contains "insert"),
      and unclassified_admin_activity's catch-all would alert on every
      host maintenance event once System Event logs are enabled.
    severity: LOW
    ai_analysis: false
    console_url_template: >-
      https://console.cloud.google.com/logs/query;query=protoPayload.resourceName%3D%22{resource_name}%22?project={project_id}
    match:
      field: raw.logName
      op: contains
      value: "cloudaudit.googleapis.com%2Fsystem_event"
    fields:
      Principal: principal_email
      Principal Subject: raw.protoPayload.authenticationInfo.principalSubject
      Event Time (IST): event_timestamp
      Method: method_name
      Resource: resource_name
      Project: project_id
      Event Detail: raw.protoPayload.request

