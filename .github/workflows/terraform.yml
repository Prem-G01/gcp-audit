name: Terraform

# Keyless throughout: both jobs authenticate via Workload Identity
# Federation (google-github-actions/auth), never a JSON key secret. The
# plan job impersonates the read-only plan SA; the apply job impersonates
# the write-capable apply SA -- both created once by terraform/bootstrap/
# (see terraform/bootstrap/README.md), never by this workflow.
#
# Required repository variables (Settings -> Secrets and variables ->
# Actions -> Variables). None are secret; WIF has no long-lived credential.
#   TF_PLAN_WIF_PROVIDER, TF_APPLY_WIF_PROVIDER
#   TF_PLAN_SERVICE_ACCOUNT, TF_APPLY_SERVICE_ACCOUNT
#   TF_PROJECT_ID, TF_BACKEND_BUCKET
#   TF_VAR_REGION            (e.g. asia-south1)
#   TF_VAR_DEPLOYMENT_MODE   (project_only | full)
#
# IMPORTANT: env var names below are TF_VAR_ + the *exact* variable name as
# declared in terraform/variables.tf (lowercase). TF_VAR_REGION would map to
# a variable named "REGION", which does not exist. Do not "fix" the casing.
#
# Any variable NOT listed in an env block intentionally falls back to its
# default in terraform/variables.tf. Do not add `${{ vars.SOMETHING }}` for
# a repository variable that does not exist -- it resolves to an empty
# string and silently overrides the default.
#
# A GitHub Environment named "production" with required reviewers gates the
# apply job (Settings -> Environments) -- this touches production alerting
# infra.

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: terraform plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.TF_PLAN_WIF_PROVIDER }}
          service_account: ${{ vars.TF_PLAN_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform init
        working-directory: terraform
        run: terraform init -backend-config=backend.hcl

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform plan
        id: plan
        working-directory: terraform
        env:
          TF_VAR_terraform_deploy_service_account_email: ${{ vars.TF_PLAN_SERVICE_ACCOUNT }}
          TF_VAR_project_id: ${{ vars.TF_PROJECT_ID }}
          TF_VAR_region: ${{ vars.TF_VAR_REGION }}
          TF_VAR_deployment_mode: ${{ vars.TF_VAR_DEPLOYMENT_MODE }}
        run: |
          terraform plan -no-color -input=false -out=tfplan | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8').slice(-60000);
            const body = `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: terraform apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.TF_APPLY_WIF_PROVIDER }}
          service_account: ${{ vars.TF_APPLY_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform init
        working-directory: terraform
        run: terraform init -backend-config=backend.hcl

      - name: terraform apply
        working-directory: terraform
        env:
          TF_VAR_terraform_deploy_service_account_email: ${{ vars.TF_APPLY_SERVICE_ACCOUNT }}
          TF_VAR_project_id: ${{ vars.TF_PROJECT_ID }}
          TF_VAR_region: ${{ vars.TF_VAR_REGION }}
          TF_VAR_deployment_mode: ${{ vars.TF_VAR_DEPLOYMENT_MODE }}
        run: terraform apply -no-color -input=false -auto-approve